name: Generate Proto

on:
  push:
    branches:
      - main
    paths:
      - 'proto/**'
  pull_request:
    paths:
      - 'proto/**'
  workflow_dispatch:

jobs:
  generate:
    name: Generate Go code from proto
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '25.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Create output directory
        run: mkdir -p gen/go/payment

      - name: Generate Go code
        run: |
          protoc \
            --proto_path=proto/payment \
            --go_out=gen/go/payment \
            --go_opt=paths=source_relative \
            --go-grpc_out=gen/go/payment \
            --go-grpc_opt=paths=source_relative \
            --go-grpc_opt=require_unimplemented_servers=false \
            proto/payment/payment.proto

      - name: Check for changes
        id: git_diff
        run: |
          git diff --exit-code gen/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit generated files
        if: steps.git_diff.outputs.changed == 'true' && github.event_name == 'push'
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gen/
          git commit -m "chore: regenerate proto [skip ci]"
          git push